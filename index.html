<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>v寶專用 💙 翠灣邨實時巴士時間表</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f0f8ff;
      color: #333;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(25, 118, 210, 0.15);
      border: 2px solid #64b5f6;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #1e88e5, #1565c0);
      color: white;
      padding: 20px;
      text-align: center;
    }
    .header h1 { font-size: 20px; font-weight: bold; margin-bottom: 6px; }
    .header p { font-size: 13px; opacity: 0.9; }
    .update-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.6);
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 10px;
      cursor: pointer;
    }
    .eta-list { padding: 16px; }
    .route-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fffdf0;
      border: 1.5px solid #ffd100;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .route-item.kmb {
      background: #fff5f5;
      border-color: #ff5252;
    }
    .route-badge {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 75px;
    }
    .route-number {
      font-size: 20px;
      font-weight: 800;
    }
    .route-item.ctb .route-number { color: #1565c0; }
    .route-item.kmb .route-number { color: #e60012; }
    .company-tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      color: white;
      font-weight: bold;
      margin-top: 2px;
    }
    .ctb-tag { background-color: #ffd100; color: #333; }
    .kmb-tag { background-color: #e60012; }

    .route-info {
      flex: 1;
      padding: 0 12px;
    }
    .dest-name { font-size: 14px; font-weight: bold; color: #444; }
    
    .eta-times {
      text-align: right;
      min-width: 120px;
    }
    .primary-eta {
      font-size: 15px;
      font-weight: bold;
      color: #1565c0;
    }
    .secondary-eta {
      font-size: 11px;
      color: #777;
      margin-top: 3px;
    }
    .status-msg {
      text-align: center;
      padding: 20px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>v寶專用 💙 時間表</h1>
      <p>📍 永泰道 - 翠灣邨 (Tsui Wan Estate)</p>
      <button class="update-btn" onclick="loadAllEta()">🔄 即時更新到站時間</button>
    </div>

    <div class="eta-list" id="etaContainer">
      <div class="status-msg">正在為 v寶 載入巴士班次...</div>
    </div>
  </div>

  <script>
    // 翠灣邨 永泰道 車站編號
    const KMB_STOP_ID = '001407';
    const CTB_STOP_ID = '001267';

    // 關注路線清單
    const WATCH_ROUTES = [
      { route: '788', company: 'CTB', dest: '中環 (港澳碼頭)' },
      { route: '789', company: 'CTB', dest: '金鐘 (德立街)' },
      { route: '85',  company: 'CTB', dest: '寶馬山 / 小西灣' },
      { route: '8X',  company: 'CTB', dest: '跑馬地 (下)' },
      { route: '118', company: 'KMB', dest: '長沙灣 (深旺道)' },
      { route: '608P',company: 'KMB', dest: '九龍城 (盛德街)' }
    ];

    // 單獨獲取城巴某路線 ETA
    async function fetchCtbEta(route) {
      try {
        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/citybus-nwfb/stop-eta/CTB/${CTB_STOP_ID}/${route}`);
        const data = await res.json();
        return data.data || [];
      } catch (err) {
        return [];
      }
    }

    // 單獨獲取九巴所有路線 ETA
    async function fetchKmbEta() {
      try {
        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${KMB_STOP_ID}`);
        const data = await res.json();
        return data.data || [];
      } catch (err) {
        return [];
      }
    }

    async function loadAllEta() {
      const container = document.getElementById('etaContainer');
      const now = new Date();

      try {
        // 並行發送所有數據請求
        const ctbPromises = WATCH_ROUTES.filter(r => r.company === 'CTB').map(r => fetchCtbEta(r.route));
        const kmbPromise = fetchKmbEta();

        const [ctbResults, kmbData] = await Promise.all([
          Promise.all(ctbPromises),
          kmbPromise
        ]);

        // 合併城巴陣列
        const ctbData = ctbResults.flat();

        let html = '';

        WATCH_ROUTES.forEach(target => {
          let matched = [];
          if (target.company === 'CTB') {
            matched = ctbData.filter(item => item.route === target.route && item.eta);
          } else {
            matched = kmbData.filter(item => item.route === target.route && item.eta);
          }

          const companyClass = target.company.toLowerCase();
          const tagText = target.company === 'CTB' ? '城巴' : '九巴';
          const tagClass = target.company === 'CTB' ? 'ctb-tag' : 'kmb-tag';

          if (matched.length > 0) {
            // 按時間排序
            matched.sort((a, b) => new Date(a.eta) - new Date(b.eta));

            const bus1 = matched[0];
            const bus2 = matched[1];

            const diff1 = Math.max(0, Math.round((new Date(bus1.eta) - now) / 60000));
            const timeStr1 = new Date(bus1.eta).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            let primaryStr = diff1 === 0 ? '即將到站' : `${diff1} 分鐘 <span style="font-size:11px;font-weight:normal;">(${timeStr1})</span>`;
            
            let secondEtaStr = '暫無次班';
            if (bus2 && bus2.eta) {
              const diff2 = Math.max(0, Math.round((new Date(bus2.eta) - now) / 60000));
              const timeStr2 = new Date(bus2.eta).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
              secondEtaStr = `次班: ${timeStr2} (${diff2}分)`;
            }

            html += `
              <div class="route-item ${companyClass}">
                <div class="route-badge">
                  <span class="route-number">${target.route}</span>
                  <span class="company-tag ${tagClass}">${tagText}</span>
                </div>
                <div class="route-info">
                  <div class="dest-name">往 ${bus1.dest_tc || target.dest}</div>
                </div>
                <div class="eta-times">
                  <div class="primary-eta">${primaryStr}</div>
                  <div class="secondary-eta">${secondEtaStr}</div>
                </div>
              </div>
            `;
          } else {
            // 暫無班次時顯示預設資訊
            html += `
              <div class="route-item ${companyClass}" style="opacity:0.7;">
                <div class="route-badge">
                  <span class="route-number">${target.route}</span>
                  <span class="company-tag ${tagClass}">${tagText}</span>
                </div>
                <div class="route-info">
                  <div class="dest-name">往 ${target.dest}</div>
                </div>
                <div class="eta-times">
                  <div class="primary-eta" style="color:#888;font-size:13px;">未有班次</div>
                  <div class="secondary-eta">---</div>
                </div>
              </div>
            `;
          }
        });

        container.innerHTML = html;

      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="status-msg">載入失敗，請點擊上方按鈕重試</div>`;
      }
    }

    loadAllEta();
    setInterval(loadAllEta, 15000);
  </script>
</body>
</html>
