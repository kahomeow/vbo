<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>v寶專用 💙 城巴翠灣邨時間表</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f0f8ff;
      color: #333;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(25, 118, 210, 0.15);
      border: 2px solid #64b5f6;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #1e88e5, #1565c0);
      color: white;
      padding: 20px;
      text-align: center;
    }
    .header h1 { font-size: 20px; font-weight: bold; margin-bottom: 6px; }
    .header p { font-size: 13px; opacity: 0.9; }
    .update-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.6);
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 10px;
      cursor: pointer;
    }
    .eta-list { padding: 16px; }
    .route-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fffdf0;
      border: 1.5px solid #ffd100;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .route-badge {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 70px;
    }
    .route-number {
      font-size: 22px;
      font-weight: 800;
      color: #1565c0;
    }
    .company-tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background-color: #ffd100;
      color: #333;
      font-weight: bold;
      margin-top: 2px;
    }
    .route-info {
      flex: 1;
      padding: 0 12px;
    }
    .dest-name { font-size: 14px; font-weight: bold; color: #444; }
    
    .eta-times {
      text-align: right;
      min-width: 125px;
    }
    .primary-eta {
      font-size: 15px;
      font-weight: bold;
      color: #1565c0;
    }
    .secondary-eta {
      font-size: 11px;
      color: #777;
      margin-top: 3px;
    }
    .status-msg {
      text-align: center;
      padding: 20px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>v寶專用 💙 城巴時間表</h1>
      <p>📍 永泰道 - 翠灣邨 (Tsui Wan Estate)</p>
      <button class="update-btn" onclick="loadCtbEta()">🔄 即時更新到站時間</button>
    </div>

    <div class="eta-list" id="etaContainer">
      <div class="status-msg">正在為 v寶 載入城巴班次...</div>
    </div>
  </div>

  <script>
    // 翠灣邨, 永泰道 城巴官方 ID
    const CTB_STOP_ID = '001267';

    // 翠灣邨主要城巴路線
    const CTB_ROUTES = [
      { route: '788', dest: '中環 (港澳碼頭)' },
      { route: '789', dest: '金鐘 (樂禮街)' },
      { route: '8',   dest: '杏花邨' },
      { route: '85',  dest: '寶馬山 / 北角' },
      { route: '770', dest: '田灣' }
    ];

    async function loadCtbEta() {
      const container = document.getElementById('etaContainer');
      const now = new Date();

      try {
        // 直接 call 城巴官方全站 API
        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/citybus-nwfb/stop-eta/CTB/${CTB_STOP_ID}`);
        const data = await res.json();
        const etaList = data.data || [];

        let html = '';

        CTB_ROUTES.forEach(target => {
          // 過濾對應路線且有 ETA 的數據
          const matched = etaList.filter(item => item.route === target.route && item.eta);

          if (matched.length > 0) {
            // 按時間先後排序
            matched.sort((a, b) => new Date(a.eta) - new Date(b.eta));

            const bus1 = matched[0];
            const bus2 = matched[1];

            const diff1 = Math.max(0, Math.round((new Date(bus1.eta) - now) / 60000));
            const timeStr1 = new Date(bus1.eta).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            let primaryStr = diff1 === 0 ? '即將到站' : `${diff1} 分鐘 <span style="font-size:11px;font-weight:normal;">(${timeStr1})</span>`;
            
            let secondEtaStr = '暫無次班';
            if (bus2 && bus2.eta) {
              const diff2 = Math.max(0, Math.round((new Date(bus2.eta) - now) / 60000));
              const timeStr2 = new Date(bus2.eta).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
              secondEtaStr = `次班: ${timeStr2} (${diff2}分)`;
            }

            html += `
              <div class="route-item">
                <div class="route-badge">
                  <span class="route-number">${target.route}</span>
                  <span class="company-tag">城巴</span>
                </div>
                <div class="route-info">
                  <div class="dest-name">往 ${bus1.dest_tc || target.dest}</div>
                </div>
                <div class="eta-times">
                  <div class="primary-eta">${primaryStr}</div>
                  <div class="secondary-eta">${secondEtaStr}</div>
                </div>
              </div>
            `;
          } else {
            html += `
              <div class="route-item" style="opacity:0.6;">
                <div class="route-badge">
                  <span class="route-number">${target.route}</span>
                  <span class="company-tag">城巴</span>
                </div>
                <div class="route-info">
                  <div class="dest-name">往 ${target.dest}</div>
                </div>
                <div class="eta-times">
                  <div class="primary-eta" style="color:#888;font-size:13px;">未有班次</div>
                  <div class="secondary-eta">---</div>
                </div>
              </div>
            `;
          }
        });

        container.innerHTML = html;

      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="status-msg">載入城巴資料失敗，請點擊按鈕重試</div>`;
      }
    }

    loadCtbEta();
    setInterval(loadCtbEta, 15000);
  </script>
</body>
</html>
